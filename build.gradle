plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        // location of the maven that hosts JEI files since January 2023
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven { url = "https://maven.firstdark.dev/snapshots" }
    maven { url = uri("${projectDir}/maven-local") }
    maven { url = "https://maven.createmod.net" } // Ponder, Flywheel
    maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate

    maven { // For Veil
        name = 'BlameJared Maven (CrT / Bookshelf)'
        url = 'https://maven.blamejared.com'
    }
    maven {
        url = "https://maven.ryanhcode.dev/releases"
        name = "RyanHCode Maven"
    }
    maven {
        name = "Illusive Soulworks maven"
        url = "https://maven.theillusivec4.top/"
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            // 单独一个目录：客户端的 run/ 里有你的存档和设置，别混在一起
            gameDirectory = project.file('run-server')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // 服务器自测场景（默认不跑）。跑法：./gradlew runServer -PshelflifeSelfTest=true
            // 用 Gradle 属性而不是 -D：系统属性不会进配置缓存的输入，改了它不会失效，白排查一轮
            systemProperty 'shelflife.selftest', (project.findProperty('shelflifeSelfTest') ?: 'false')
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }


dependencies {
    //本地mcp运行环境
    implementation('io.github.uicdb:mmccpp:1.0.0') { transitive = false }
    //航空学
    implementation("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}") { transitive = false }
    implementation("dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}") { transitive = false }
    implementation("dev.simulated_team.simulated:simulated-neoforge-${minecraft_version}:${simulated_version}") { transitive = false }
    implementation("foundry.veil:veil-neoforge-${minecraft_version}:${veil_version}") { transitive = false }
    implementation("dev.eriksonn.aeronautics:aeronautics-neoforge-${minecraft_version}:${aeronautics_version}") { transitive = false }
    implementation("foundry.imguimc:imguimc-neoforge-${minecraft_version}:${imguimc_version}") { transitive = false }

    implementation("com.simibubi.create:create-$minecraft_version:$create_version") { transitive = false }//机械动力

    // ---- 以下只进编译 / 开发环境，运行期由上面某个依赖自带 ----
    implementation 'org.projectlombok:lombok:+'
    annotationProcessor 'org.projectlombok:lombok:+'
    //注册库（不是 mod，create 运行期自带，这里只给编译用）
    jarJar(compileOnly("com.tterrag.registrate:Registrate:$registrate_version"))
    //飞轮（这里只有 API；真正的 Flywheel 由 create 内嵌，别再单独分发一份）
    implementation("dev.engine-room.flywheel:flywheel-neoforge-api-$minecraft_version:$flywheel_version")
    //思索（同上，create 内嵌了 ponder）
    implementation("net.createmod.ponder:ponder-neoforge:$ponder_version+mc$minecraft_version") {
        version {
            strictly "[$ponder_version+mc$minecraft_version,)"
            prefer "$ponder_version+mc$minecraft_version"
            transitive = false
        }
    }
    // Compile against only the API artifact
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    // Use the full Curios API jar at runtime
    runtimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    //jei
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    // createishot（可选依赖）：编译期要看到它的 API，所以 jar 提交在 libs/ 里 ——
    // 放在 run/mods 的话 run/ 被 gitignore，换台机器就编译不过。
    // 不用 exists() 包起来是故意的：jar 缺了就该编译失败，而不是留下一个难查的 NoClassDefFoundError。
    // 走和 Curios 一样的路子：compileOnly 供编译，runtimeOnly 只进开发运行期，都不会打进发布包。
    compileOnly files('libs/createishot-1.0-SNAPSHOT.jar')
    runtimeOnly files('libs/createishot-1.0-SNAPSHOT.jar')

    // 另外两个可选依赖：走和 createishot 一样的路子 —— compileOnly 供编译，runtimeOnly 只进开发运行期。
    // 两个都不会被打进发布包（不是 jarJar，只是开发环境的 classpath）。
    // 需要 runtimeOnly 的理由：管道兼容的钩子只有把 mod 真加载起来才验证得了，
    // 之前只用 compileOnly 的后果是"游戏里根本没有 Mekanism / Pipez"，压根没法测。
    compileOnly files('libs/mekanism-1.21.1-10.7.19.85.jar')
    runtimeOnly files('libs/mekanism-1.21.1-10.7.19.85.jar')
    compileOnly files('libs/pipez-neoforge-1.21.1-1.2.31.jar')
    runtimeOnly files('libs/pipez-neoforge-1.21.1-1.2.31.jar')
    // Create 不在这里：它由上面的 implementation("com.simibubi.create:create-...") 提供编译 + 运行期，
    // 原来那份 libs/create-*.jar 已经删掉了（留着只会是个指向不存在文件的死引用）。

    def runModsDir = file('run/mods')
    if (runModsDir.exists() && runModsDir.listFiles()) {
        def modFiles = fileTree(dir: runModsDir, include: '*.jar').matching {
            exclude "${project.mod_id}*.jar",
                    "jei-1.21.1-neoforge-19.39.0.368.jar"
        }
        if (!modFiles.isEmpty()) {
            compileOnly modFiles
        }
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
